[project]
name = "hk-finreg-ai-backend"
version = "2.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic-settings>=2.1.0",
  "langchain>=0.3.0",
  "langchain-core>=1.5.3",
  "langchain-openai>=0.3.0",
  "langchain-community>=0.3.0",
  "langchain-classic>=0.1.0",
  "langgraph>=0.2.0",
  "langgraph-checkpoint-postgres>=1.0.0",
  "langsmith>=0.1.0",
  "cohere>=5.0.0",
  "chromadb>=0.4.0",
  "pypdf>=4.0.0",
  "pypdfium2>=5.12.1,<6.0.0",
  "rapidocr>=3.9.2,<4.0.0",
  "cryptography>=42.0.0",
  "langchain-text-splitters>=0.3.0",
  "rank_bm25>=0.2.2",
  "networkx>=3.2.0",
  "python-dotenv>=1.0.0",
  "urllib3>=2.7.0",
  "redis>=5.0.0",
  "psycopg[binary]>=3.1.0",
]

[dependency-groups]
test = ["pytest>=9.0.0", "pytest-cov>=7.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
