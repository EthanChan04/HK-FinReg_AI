[project]
name = "hk-finreg-ai-backend"
version = "2.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.141.1",
  "uvicorn[standard]>=0.52.4",
  "pydantic-settings>=2.15.0",
  "langchain>=1.3.18",
  "langchain-core>=1.6.1",
  "langchain-openai>=1.6.0",
  "langchain-community>=0.4.2",
  "langchain-classic>=1.0.8",
  "langgraph>=1.2.11",
  "langgraph-checkpoint-postgres>=3.1.2",
  "langsmith>=0.11.2",
  "cohere>=7.1.0",
  "chromadb>=1.5.9",
  "pypdf>=6.16.2",
  "pypdfium2>=5.13.0,<6.0.0",
  "rapidocr>=3.9.2,<4.0.0",
  "cryptography>=50.0.1",
  "langchain-text-splitters>=1.1.2",
  "rank_bm25>=0.2.2",
  "networkx>=3.6.1",
  "python-dotenv>=1.2.3",
  "urllib3>=2.7.0",
  "redis>=8.1.0",
  "psycopg[binary]>=3.3.4",
]

[dependency-groups]
test = ["pytest>=9.1.1", "pytest-cov>=7.1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
