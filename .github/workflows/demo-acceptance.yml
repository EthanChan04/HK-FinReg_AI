name: DeepSeek Demo Acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-deepseek-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: https://api.deepseek.com
      DEEPSEEK_MODEL: deepseek-v4-flash
      EMBEDDING_PROVIDER: local_hash
      EMBEDDING_MODEL: local-hash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install locked backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip check
      - name: Run focused acceptance tests
        run: >-
          .venv/bin/python -m pytest -q
          tests/test_deepseek_runtime.py
          tests/test_corpus_ingestion_report.py
          tests/test_corpus_ocr_fallback.py
          tests/test_live_demo_eval.py
          tests/test_live_demo_gate.py
      - name: Build fail-closed corpus cache
        run: .venv/bin/python -m app.services.corpus.build_cache
      - name: Require real DeepSeek credential
        run: test -n "$DEEPSEEK_API_KEY" || (echo "DEEPSEEK_API_KEY secret is required" && exit 1)
      - name: Capture and gate 12 real DeepSeek responses
        run: .venv/bin/python -m app.services.evaluation.live_demo_gate --output-dir ../artifacts/evaluation/live
      - name: Upload redacted acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deepseek-v4-flash-demo-acceptance
          path: artifacts/evaluation/live/
          if-no-files-found: warn
          retention-days: 14
