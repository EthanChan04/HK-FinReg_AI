name: Release Gates

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ../requirements.txt
          .venv/bin/python -m pip check
      - name: Run backend test suite
        run: .venv/bin/python -m pytest tests -q
      - name: Enforce targeted demo remediation coverage
        run: |
          .venv/bin/python -m pytest \
            tests/test_deepseek_runtime.py \
            tests/test_corpus_ingestion_report.py \
            tests/test_corpus_ocr_fallback.py \
            tests/test_live_demo_eval.py \
            tests/test_live_demo_gate.py \
            --cov=app.services.llm.deepseek \
            --cov=app.services.corpus.corpus_ingestor \
            --cov=app.services.evaluation.live_demo_eval \
            --cov=app.services.evaluation.live_demo_gate \
            --cov-report=term-missing \
            --cov-fail-under=70
      - name: Build safe corpus cache
        run: .venv/bin/python -m app.services.corpus.build_cache
      - name: Build dual regulatory graph cache
        run: .venv/bin/python -m app.services.kag.build_graph_cache
      - name: Validate regulatory release metadata
        run: .venv/bin/python -m app.services.evaluation.release_gate

  obligation-mapper-gate:
    runs-on: ubuntu-latest
    needs: backend-tests
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r ../requirements.txt
          .venv/bin/python -m pip check
      - name: Run Obligation Mapper regression gate
        run: .venv/bin/python -m app.services.evaluation.run_obligation_mapper_regression
      - name: Upload latest regression report
        uses: actions/upload-artifact@v7
        with:
          name: obligation-mapper-regression-report
          path: backend/tests/regression/obligation_mapper/latest_regression_report.json

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Frontend config tests
        run: npm run test:config
      - name: Run frontend unit tests with coverage gate
        run: npm run test:coverage
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run frontend critical-path E2E tests
        run: npm run test:e2e
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Build frontend
        run: npm run build
