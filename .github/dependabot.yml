# Dependabot configuration (T0-02: CI security audit gate)
# Keeps frontend and backend dependencies patched against known
# vulnerabilities; combined with `npm audit --audit-level=high` in
# .github/workflows/release-gates.yml, a PR is raised before a high
# vulnerability can land on the default branch.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Hong_Kong"
    open-pull-requests-limit: 3
    groups:
      frontend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      frontend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "security"
    # Fail-closed posture: do not skip security updates, ever.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "Asia/Hong_Kong"
    open-pull-requests-limit: 3
    groups:
      backend-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      backend-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "python"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions-version-updates:
        applies-to: version-updates
        patterns:
          - "*"
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
